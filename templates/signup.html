{{define "title"}}Sign up · Track Anything{{end}}
{{define "content"}}
{{with .Data}}
<article class="auth-card">
  <h1>Sign up</h1>
  {{if .Error}}<p role="alert" class="error">{{.Error}}</p>{{end}}
  <form method="post" action="/signup" class="auth-form">
    <input type="hidden" name="next" value="{{.Next}}">
    <input type="hidden" name="timezone" data-browser-timezone>
    <label class="auth-email">
      {{icon "mail"}} Email
      <input type="email" name="email" value="{{.Email}}" required autocomplete="email" {{if not .ShowPassword}}autofocus{{end}}>
    </label>
    <label class="auth-password">
      {{icon "lock"}} Password
      <input type="password" name="password" data-auth-password autocomplete="new-password" minlength="8" maxlength="72" {{if .ShowPassword}}autofocus{{end}}>
    </label>
    <button type="submit">Continue</button>
    <div class="auth-switch">
      <input type="checkbox" id="signup-password" class="auth-password-toggle" {{if .ShowPassword}}checked{{end}}>
      <label for="signup-password">
        <span class="when-closed">Sign up with a password instead</span>
        <span class="when-open">Continue without a password</span>
      </label>
    </div>
  </form>
  <p class="auth-foot">Already have an account? <a href="/login{{if .Next}}?next={{.Next | urlquery}}{{end}}">Log in</a></p>
</article>
{{end}}
{{end}}
