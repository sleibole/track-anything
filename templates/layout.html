{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Track Anything{{end}}</title>
  <meta name="theme-color" content="#0172ad">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Track Anything">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[234]..","swap":true},{"code":"...","swap":false,"error":true}]}'>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  {{block "scripts" .}}{{end}}
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="brand">{{icon "tallymarks"}} <strong>Track Anything</strong></a></li></ul>
      <ul>
        {{with .User}}
        <li><a href="/settings" aria-label="Settings" title="Settings">{{icon "settings"}}</a></li>
        <li>
          <form method="post" action="/logout" class="inline">
            <button type="submit" class="outline secondary" aria-label="Log out" title="Log out">{{icon "logout"}}</button>
          </form>
        </li>
        {{else}}
        <li><a href="/login">Log in</a></li>
        <li><a href="/signup" role="button">Sign up</a></li>
        {{end}}
      </ul>
    </nav>
  </header>
  <main class="container" id="content" hx-target="#content" hx-swap="innerHTML show:none">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
