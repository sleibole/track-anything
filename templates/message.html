{{define "title"}}{{.Data.Title}} · Track Anything{{end}}
{{define "content"}}
{{with .Data}}
<article class="auth-card">
  <h1>{{.Title}}</h1>
  <p>{{.Text}}</p>
  <p class="auth-foot">{{if or (not .Href) (eq .Href "/")}}<a {{if .Action}}role="button" {{end}}{{nav (or .Href "/")}}>{{or .Action "Back to Track Anything"}}</a>{{else}}<a href="{{.Href}}"{{if .Action}} role="button"{{end}}>{{or .Action "Back to Track Anything"}}</a>{{end}}</p>
</article>
{{end}}
{{end}}
