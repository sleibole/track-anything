{{define "title"}}{{publicTitle}}{{end}}
{{define "content"}}
<hgroup>
  <h1>{{publicTitle}}</h1>
  <p>{{publicDescription}}</p>
</hgroup>
<article class="auth-card">
  {{with .Data.Error}}<p role="alert" class="error">{{.}}</p>{{end}}
  <form method="post" action="/start" hx-post="/start" class="auth-form">
    <input type="hidden" name="timezone" data-browser-timezone>
    <label for="tracker-name">What are you tracking?</label>
    <input id="tracker-name" type="text" name="name" value="{{.Data.Name}}" required maxlength="60" autocomplete="off" placeholder="{{.Data.Placeholder}}" data-suggestions="{{.Data.Suggestions}}">
    <button type="submit">Start tracking</button>
  </form>
  <p>No email needed. Start now and add an email later.</p>
  <p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p>
</article>
{{end}}
